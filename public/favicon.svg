<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 .875 48 48" fill="none">
  <!-- The AppLogo microphone (src/app/layouts/AppHeader/AppLogo) with the fixed CTA gradient (brand-from → brand-to):
       both stops keep 3:1 on white tabs and on the dark icon background. The viewBox centers the glyph; the 512 px
       size is the raster size for the icon generator. After editing: npm run generate-pwa-assets. -->
  <defs>
    <linearGradient id="mic" gradientUnits="userSpaceOnUse" x1="24" y1="4" x2="24" y2="44">
      <stop offset="0" stop-color="#1e86ee" />
      <stop offset="1" stop-color="#7447f5" />
    </linearGradient>
  </defs>
  <rect x="16" y="4" width="16" height="26" rx="8" fill="url(#mic)" />
  <path d="M24 10v10" stroke="#fff" stroke-opacity=".45" stroke-width="3" stroke-linecap="round" />
  <path d="M10 22a14 14 0 0 0 28 0M24 36v7M17 44h14" stroke="url(#mic)" stroke-width="3.5" stroke-linecap="round" />
</svg>
